# This file shows how to use the reusable workflows from SecPal/.github
# Copy this to .github/workflows/repository-checks.yml and replace the
# placeholder with a reviewed immutable commit SHA before enabling it.

---
name: Repository Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reuse:
    uses: SecPal/.github/.github/workflows/reusable-reuse.yml@<trusted-commit-sha>
