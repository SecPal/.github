# All tracked paths are subject to central admission policy.
skip-patterns: []
disable-allow-rules:
  - dist-info
  - tests
  - examples
  - vendor
  - usr-dirs
  - locale-dir
  - markdown
  - node.js
  - golang
  - python
  - rubygems
  - wordpress
  - anaconda-log

rules:
  - id: secpal-synthetic-secret
    category: General
    title: SecPal synthetic test secret
    severity: HIGH
    regex: SECPAL_SYNTHETIC_SECRET_[A-Z0-9]{16}
    keywords:
      - SECPAL_SYNTHETIC_SECRET_
