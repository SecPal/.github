rules:
  - id: secpal-synthetic-secret
    category: General
    title: SecPal synthetic test secret
    severity: HIGH
    regex: SECPAL_SYNTHETIC_SECRET_[A-Z0-9]{16}
    keywords:
      - SECPAL_SYNTHETIC_SECRET_
