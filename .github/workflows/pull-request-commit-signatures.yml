name: Pull Request Commit Signatures

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate Signed PR Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Fetch pull request commits
        env:
          GH_TOKEN: ${{ github.token }}
          PR_COMMITS_FILE: ${{ runner.temp }}/pull-request-commits.json
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >
          gh api --paginate --slurp
          "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100"
          > "$PR_COMMITS_FILE"

      - name: Validate pull request commit signatures
        env:
          PR_COMMITS_FILE: ${{ runner.temp }}/pull-request-commits.json
        run: bash scripts/validate-pull-request-commit-signatures.sh
