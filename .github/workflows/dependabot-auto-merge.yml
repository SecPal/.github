# Dependabot Auto-Merge Workflow (.github repository)
# This is a caller workflow that uses the reusable workflow
#
# For implementation details, see:
# .github/workflows/reusable-dependabot-auto-merge.yml

---
name: Dependabot Auto-Merge

on:
  # Dependabot pull_request runs receive a read-only token. The target event is
  # safe here because this caller executes only the immutable reusable workflow
  # below, which never checks out or executes pull-request-controlled code.
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

# Ensure only one auto-merge runs at a time per PR
concurrency:
  group: ${{ github.repository }}-dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    # Gate on the PR author rather than the event actor so maintainer-triggered
    # `reopened` and `ready_for_review` events on Dependabot-authored PRs do not
    # skip auto-merge enrollment. See:
    # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#enable-auto-merge-on-a-pull-request
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    # Keep auto-merge decisions on the reviewed immutable workflow revision so
    # Dependabot PRs cannot execute unreviewed policy changes from the same PR.
    # yamllint disable rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml@105135e0a4997cc1455c14412cfe003b442c7d3d # main
    # yamllint enable rule:line-length
    with:
      # Phase 1: Only PATCH updates auto-merge
      phase: "1"
      # Use squash merge for cleaner history
      merge-method: "squash"
