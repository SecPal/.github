---
# Reusable Dependabot Auto-Merge Workflow
# Automatically merges Dependabot PRs based on configurable phase/policy
#
# Usage in other repositories (explicit caller ceiling; reads cannot be added
# by a reusable workflow when the caller grants none):
#   permissions:
#     contents: write
#     pull-requests: write
#     checks: read
#     statuses: read
#   jobs:
#     auto-merge:
#       uses: SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml@<trusted-commit-sha>
#       with:
#         phase: "1"  # Optional: 1 (PATCH only), 2 or 3 (PATCH+MINOR)
#
# For cross-repository callers, pin to a reviewed immutable commit SHA. A
# moving branch ref or stale tag can silently preserve obsolete behavior.
#
# Callers must reconcile all PR head, label, draft and target changes. Require
# source-safety before any enrollment (including phase 1);
# enrollment remains informational and manual operator requests stay untouched.
#
# Strategy:
#   Phase 1 (default): PATCH updates auto-merge ✅, MINOR/MAJOR require review
#   Phase 2: PATCH + MINOR auto-merge ✅, MAJOR requires review
#   Phase 3: PATCH + MINOR auto-merge ✅, MAJOR requires review
#
# Rollback strategy: Git revert the auto-merged commit if issues occur

name: Reusable Dependabot Auto-Merge

on:
  workflow_call:
    inputs:
      phase:
        description: "Auto-merge phase: 1 (PATCH only), 2 or 3 (PATCH+MINOR)"
        required: false
        default: "1"
        type: string
      allowed-ecosystems:
        description: "Verified dependency ecosystems allowed for this caller (comma-separated)"
        required: false
        type: string
        default: "github_actions,npm_and_yarn,composer,gradle,bundler"
      workflow-paths:
        description: "Optional JSON allowlist of Actions workflow paths; empty means all workflow files"
        required: false
        type: string
        default: "[]"
      merge-method:
        description: "Automatic merge method: squash"
        required: false
        default: "squash"
        type: string

# Enrollment uses no Actions cache; prevent cache access across the reusable call.
cache-mode: none

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  # Determine if this PR is eligible for auto-merge
  check-eligibility:
    name: Check Auto-Merge Eligibility
    runs-on: ubuntu-latest
    # Gate on the PR author rather than the event actor so maintainer-triggered
    # `reopened` and `ready_for_review` events on Dependabot-authored PRs do not
    # skip auto-merge enrollment. See:
    # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#enable-auto-merge-on-a-pull-request
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-auto-merge: ${{ steps.check.outputs.should-auto-merge }}
      update-type: ${{ steps.check.outputs.update-type }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        continue-on-error: true
        with:
          github-token: "${{ github.token }}"

      - name: Verify Dependabot source boundary
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          ALLOWED_ECOSYSTEMS: ${{ inputs.allowed-ecosystems }}
          VERIFIED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
          WORKFLOW_PATHS: ${{ inputs.workflow-paths }}
        with:
          script: |
            core.setOutput('verified', 'false');
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const expected = context.payload.pull_request.head.sha;
            const read = async () => (await github.rest.pulls.get({ owner, repo, pull_number })).data;
            const pr = await read();
            core.setOutput('labels', JSON.stringify(pr.labels?.map(label => label.name) || []));
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.draft ||
                pr.user.login !== 'dependabot[bot]' || pr.user.type !== 'Bot' ||
                pr.head.repo?.full_name !== `${owner}/${repo}` || pr.head.sha !== expected) return;
            const ecosystem = process.env.PACKAGE_ECOSYSTEM;
            if (!process.env.ALLOWED_ECOSYSTEMS.split(',').includes(ecosystem)) return;
            const verifiedDependencies = JSON.parse(process.env.VERIFIED_DEPENDENCIES || 'null');
            if (!Array.isArray(verifiedDependencies) || (ecosystem === 'github_actions' &&
                verifiedDependencies.some(item => /^SecPal\/\.github(?:\/|$)/i.test(item.dependencyName)))) return;
            // Branch-derived metadata is not path authorization. Read only the
            // accepted base configuration; never load code from the PR head.
            const config = (await github.rest.repos.getContent({ owner, repo,
              path: '.github/dependabot.yml', ref: pr.base.sha })).data;
            if (config.type !== 'file' || config.encoding !== 'base64' || !config.content) return;
            const configured = require('node:child_process').spawnSync('ruby', ['-rjson', '-ryaml', '-e', String.raw`
              begin
                input = JSON.parse(STDIN.read)
                config = YAML.safe_load(input.fetch('config'), permitted_classes: [], permitted_symbols: [], aliases: false)
                raise 'unsupported config' unless config.fetch('version') == 2
                directories = config.fetch('updates').select do |entry|
                  entry.fetch('package-ecosystem') == input.fetch('ecosystem') &&
                    entry.fetch('target-branch', input.fetch('default_branch')) == input.fetch('target')
                end.flat_map { |entry| entry.key?('directories') ? entry.fetch('directories') : [entry.fetch('directory')] }
                print JSON.generate(directories)
              rescue StandardError
                exit 1
              end
            `], { input: JSON.stringify({ config: Buffer.from(config.content, 'base64').toString('utf8'),
              ecosystem: ({ npm_and_yarn: 'npm', github_actions: 'github-actions' })[ecosystem] || ecosystem,
              target: pr.base.ref, default_branch: context.payload.repository.default_branch }),
              encoding: 'utf8', env: { PATH: process.env.PATH }, timeout: 10000, maxBuffer: 1024 * 1024 });
            if (configured.status !== 0) return;
            const directories = JSON.parse(configured.stdout);
            // Exact paths only; unsupported globs and noncanonical paths fail closed.
            if (!Array.isArray(directories) || !directories.length || !directories.every(directory =>
                typeof directory === 'string' && (directory === '/' ||
                  /^\/(?:[A-Za-z0-9_.-]+\/)*[A-Za-z0-9_.-]+$/.test(directory) &&
                  directory.split('/').every(part => part !== '.' && part !== '..')))) return;
            const prefixes = directories.map(directory => directory === '/' ? '' : directory.slice(1) + '/');
            const manifests = {
              npm_and_yarn: ['package.json', 'package-lock.json', 'npm-shrinkwrap.json', 'yarn.lock', 'pnpm-lock.yaml'],
              composer: ['composer.json', 'composer.lock'],
              bundler: ['Gemfile', 'Gemfile.lock'],
              gradle: ['build.gradle', 'build.gradle.kts', 'settings.gradle', 'settings.gradle.kts',
                'variables.gradle', 'gradle/libs.versions.toml', 'app/build.gradle', 'app/build.gradle.kts'],
            };
            const workflowPaths = JSON.parse(process.env.WORKFLOW_PATHS || '[]');
            if (!Array.isArray(workflowPaths) || !workflowPaths.every(path =>
                typeof path === 'string' && /^\.github\/workflows\/[^/]+\.ya?ml$/.test(path))) return;
            const allowed = path => typeof path === 'string' && (ecosystem === 'github_actions'
              ? /^\.github\/workflows\/[^/]+\.ya?ml$/.test(path) &&
                directories.includes('/') && (!workflowPaths.length || workflowPaths.includes(path))
              : prefixes.some(prefix => (manifests[ecosystem] || []).some(name => path === prefix + name)));
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number, per_page: 100 });
            if (!files.length || files.length !== pr.changed_files ||
                !files.every(file => allowed(file.filename) && (!file.previous_filename || allowed(file.previous_filename)))) return;
            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number, per_page: 100 });
            // fetch-metadata classifies the first commit; require it to be the exact head.
            if (commits.length !== 1 || commits.length !== pr.commits || commits[0].sha !== expected ||
                !commits.every(commit => commit.author?.login === 'dependabot[bot]' &&
                  ['web-flow', 'dependabot[bot]'].includes(commit.committer?.login) &&
                  commit.commit.verification?.verified === true && commit.parents.length === 1)) return;
            // fetch-metadata can calculate a missing class using a mutable PR
            // title. Require each class in the signed YAML metadata itself.
            const proof = require('node:child_process').spawnSync('ruby', ['-rjson', '-ryaml', '-e', String.raw`
              begin
                input = JSON.parse(STDIN.read)
                fragment = input.fetch('message')[/^---\n([\s\S]*?)\n^\.\.\.\n/m, 1]
                metadata = YAML.safe_load(fragment, permitted_classes: [], permitted_symbols: [], aliases: false)
                dependencies = metadata.fetch('updated-dependencies')
                verified = input.fetch('verified')
                types = %w[version-update:semver-patch version-update:semver-minor version-update:semver-major]
                valid = dependencies.is_a?(Array) && verified.is_a?(Array) && !dependencies.empty? &&
                  dependencies.length == verified.length && dependencies.each_with_index.all? do |dependency, index|
                    expected = verified[index]
                    dependency.is_a?(Hash) && expected.is_a?(Hash) &&
                      dependency['dependency-name'] == expected['dependencyName'] &&
                      types.include?(dependency['update-type']) && dependency['update-type'] == expected['updateType']
                  end
                print(valid ? 'true' : 'false')
              rescue StandardError
                print 'false'
              end
            `], { input: JSON.stringify({ message: commits[0].commit.message,
              verified: verifiedDependencies }),
              encoding: 'utf8', env: { PATH: process.env.PATH }, timeout: 10000, maxBuffer: 1024 * 1024 });
            if (proof.status !== 0 || proof.stdout !== 'true') return;
            const after = await read();
            if (after.head.sha !== expected || after.base.sha !== pr.base.sha || after.state !== 'open') return;
            core.setOutput('verified', 'true');

      - name: Check PR metadata
        id: check
        env:
          SOURCE_VERIFIED: ${{ steps.source.outputs.verified }}
          PR_LABELS: ${{ steps.source.outputs.labels }}
          PHASE: ${{ inputs.phase }}
          METADATA_STEP_OUTCOME: ${{ steps.metadata.outcome }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
          UPDATE_TYPE_RAW: ${{ steps.metadata.outputs.update-type }}
          UPDATED_DEPENDENCIES_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          PREVIOUS_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
        run: |
          is_grouped_update() {
            [[ -n "${DEPENDENCY_GROUP}" || "${DEPENDENCY_NAMES}" == *,* ]]
          }

          is_reviewed_semver_group() {
            case "${DEPENDENCY_GROUP}:${PACKAGE_ECOSYSTEM}:${UPDATE_TYPE_RAW}" in
              github-actions-patch:github_actions:version-update:semver-patch | \
                github-actions-minor:github_actions:version-update:semver-minor | \
                github-actions-major:github_actions:version-update:semver-major)
                ;;
              *)
                [[ "${PACKAGE_ECOSYSTEM}" != "github_actions" &&
                  "${DEPENDENCY_GROUP}" != github-actions-* ]] || return 1
                ;;
            esac

            jq -e \
              --arg dependency_group "${DEPENDENCY_GROUP}" \
              --arg package_ecosystem "${PACKAGE_ECOSYSTEM}" \
              --arg update_type "${UPDATE_TYPE_RAW}" \
              '
                if type != "array" or length == 0 then
                  false
                else
                  all(
                    .[];
                    type == "object" and
                    .dependencyGroup == $dependency_group and
                    .packageEcosystem == $package_ecosystem and
                    .updateType == $update_type
                  )
                end
              ' <<<"${UPDATED_DEPENDENCIES_JSON}" >/dev/null
          }

          echo "PR Labels: ${PR_LABELS}"
          echo "Auto-merge Phase: ${PHASE}"
          echo "Metadata step outcome: ${METADATA_STEP_OUTCOME}"
          echo "Dependency names: ${DEPENDENCY_NAMES}"
          echo "Dependency group: ${DEPENDENCY_GROUP}"
          echo "Maintainer changes: ${MAINTAINER_CHANGES}"
          echo "Package ecosystem: ${PACKAGE_ECOSYSTEM}"
          echo "Dependabot update-type: ${UPDATE_TYPE_RAW}"
          echo "Updated dependencies JSON: ${UPDATED_DEPENDENCIES_JSON}"
          echo "Previous version: ${PREVIOUS_VERSION}"
          echo "New version: ${NEW_VERSION}"

          # Check if PR has 'dependencies' label (required for Dependabot PRs)
          if ! jq -e 'type == "array" and index("dependencies") != null' <<<"${PR_LABELS}" >/dev/null; then
            echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
            echo "update-type=missing-dependencies-label" >> "${GITHUB_OUTPUT}"
            echo "❌ Not eligible: Missing dependencies label"
            exit 0
          fi

          if [[ "${METADATA_STEP_OUTCOME}" != "success" ]]; then
            echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
            echo "update-type=metadata-unavailable" >> "${GITHUB_OUTPUT}"
            echo "❌ Not eligible: Dependabot metadata verification failed; route to manual review"
            exit 0
          fi

          if [[ "${SOURCE_VERIFIED}" != "true" ]]; then
            echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
            echo "update-type=unverified-source" >> "${GITHUB_OUTPUT}"
            echo "Not eligible: source identity or changed paths could not be verified"
            exit 0
          fi

          if [[ "${MAINTAINER_CHANGES}" != "false" ]]; then
            echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
            echo "update-type=maintainer-changes" >> "${GITHUB_OUTPUT}"
            echo "❌ Not eligible: Dependabot PR includes maintainer changes"
            exit 0
          fi

          # fetch-metadata reports only the highest aggregate update type.
          # Verify every JSON member against the reviewed group/type contract;
          # unknown, unversioned, mixed, or mismatched groups fail closed.
          if is_grouped_update && ! is_reviewed_semver_group; then
            echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
            echo "update-type=grouped-update" >> "${GITHUB_OUTPUT}"
            echo "❌ Not eligible: Dependabot group is not a reviewed homogeneous semver group"
            exit 0
          fi

          case "${UPDATE_TYPE_RAW}" in
            version-update:semver-major)
              echo "update-type=major" >> "${GITHUB_OUTPUT}"
              echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
              echo "❌ Not eligible: MAJOR semver update requires manual review (Phase ${PHASE})"
              ;;
            version-update:semver-minor)
              echo "update-type=minor" >> "${GITHUB_OUTPUT}"
              if [[ "${PHASE}" == "2" || "${PHASE}" == "3" ]]; then
                echo "should-auto-merge=true" >> "${GITHUB_OUTPUT}"
                echo "✅ Eligible for auto-merge (Phase ${PHASE}): MINOR semver update"
              else
                echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
                echo "❌ Not eligible: MINOR semver update requires manual review (Phase ${PHASE})"
              fi
              ;;
            version-update:semver-patch)
              echo "update-type=patch" >> "${GITHUB_OUTPUT}"
              echo "should-auto-merge=true" >> "${GITHUB_OUTPUT}"
              echo "✅ Eligible for auto-merge (Phase ${PHASE}): PATCH semver update"
              ;;
            "")
              echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
              if [[ "${PACKAGE_ECOSYSTEM}" == "github_actions" ]] &&
                [[ -n "${PREVIOUS_VERSION}" && -n "${NEW_VERSION}" ]]; then
                echo "update-type=github-actions-non-semver" >> "${GITHUB_OUTPUT}"
                echo "❌ Not eligible: GitHub Actions reference update does not expose a semver update-type"
              else
                echo "update-type=metadata-unavailable" >> "${GITHUB_OUTPUT}"
                echo "❌ Not eligible: Dependabot metadata did not include an update type"
              fi
              ;;
            *)
              echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
              echo "update-type=non-semver" >> "${GITHUB_OUTPUT}"
              echo "❌ Not eligible: Unsupported Dependabot update type '${UPDATE_TYPE_RAW}'"
              ;;
          esac

  source-safety:
    name: Dependabot Source Safety
    needs: check-eligibility
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Reconcile automated enrollment against this exact head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ELIGIBLE: >-
            ${{ needs.check-eligibility.result == 'success' &&
                needs.check-eligibility.outputs.should-auto-merge == 'true' && inputs.merge-method == 'squash' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const expected = context.payload.pull_request.head.sha;
            const read = async () => {
              const pr = (await github.rest.pulls.get({ owner, repo, pull_number })).data;
              if (pr.head.sha !== expected || pr.state !== 'open' ||
                  !Object.hasOwn(pr, 'auto_merge') || !Array.isArray(pr.labels) ||
                  (pr.auto_merge && !pr.auto_merge.enabled_by?.login)) {
                throw new Error('Current PR enrollment identity is unavailable or changed');
              }
              return pr;
            };
            const pr = await read();
            if (pr.user.login === 'dependabot[bot]' &&
                pr.auto_merge?.enabled_by.login === 'github-actions[bot]' &&
                (process.env.ELIGIBLE !== 'true' || !pr.labels.some(label => label.name === 'dependencies') ||
                  pr.base.ref !== 'main' || pr.draft || pr.auto_merge.merge_method !== 'squash')) {
              await github.graphql('mutation($id: ID!) { disablePullRequestAutoMerge(input: {pullRequestId: $id}) { clientMutationId } }',
                { id: pr.node_id });
              if ((await read()).auto_merge?.enabled_by.login === 'github-actions[bot]') {
                throw new Error('Unsafe automated enrollment is still active');
              }
            }

  # Enrollment is informational; branch protection owns quality admission.
  auto-merge:
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    needs: [check-eligibility, source-safety]
    if: needs.check-eligibility.outputs.should-auto-merge == 'true'
    timeout-minutes: 20
    steps:
      - name: Preserve existing operator enrollment
        id: enrollment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = (await github.rest.pulls.get({ ...context.repo,
              pull_number: context.payload.pull_request.number })).data;
            if (pr.head.sha !== context.payload.pull_request.head.sha || pr.base.ref !== 'main' ||
                pr.state !== 'open' || pr.draft || !Object.hasOwn(pr, 'auto_merge') ||
                !Array.isArray(pr.labels)) throw new Error('PR changed');
            core.setOutput('required', pr.auto_merge === null &&
              pr.labels.some(label => label.name === 'dependencies') ? 'true' : 'false');

      - name: Enable auto-merge
        if: steps.enrollment.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A failed revocation must block merging. Never enroll before GitHub
          # actually requires this run's successful safety check.
          if checks=$(gh pr checks "$PR_URL" --required --json name,state,link); then
            :
          else
            status=$?
            case "$status" in
              1|8) ;; # Other protected checks may still be failing or pending.
              *) exit "$status" ;;
            esac
          fi
          jq -e --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/job/" '
            [.[] | select(.name == "auto-merge / Dependabot Source Safety" and (.link | startswith($run)))] |
            length == 1 and .[0].state == "SUCCESS"
          ' <<< "$checks"
          echo "🤖 Enabling auto-merge..."
          echo "PR: ${PR_URL}"
          echo "Update type: ${{ needs.check-eligibility.outputs.update-type }}"
          echo "Merge method: ${MERGE_METHOD}"
          echo "Phase: ${{ inputs.phase }}"

          # Enable auto-merge with configured merge strategy
          case "${MERGE_METHOD}" in
            squash)
              gh pr merge --auto --squash --match-head-commit "${EXPECTED_HEAD}" "${PR_URL}"
              ;;
            *)
              echo "❌ Invalid merge method: ${MERGE_METHOD}"
              exit 1
              ;;
          esac

          echo "✅ Auto-merge enabled! PR will merge when all checks pass."

  # Report decisions in the run, avoiding stale or repeated PR comments.
  skip-auto-merge:
    name: Skip Auto-Merge
    runs-on: ubuntu-latest
    needs: check-eligibility
    if: >-
      needs.check-eligibility.outputs.should-auto-merge != 'true' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record manual decision
        env:
          UPDATE_TYPE: ${{ needs.check-eligibility.outputs.update-type }}
        run: printf 'Manual review required (%s).\n' "$UPDATE_TYPE" >> "$GITHUB_STEP_SUMMARY"
