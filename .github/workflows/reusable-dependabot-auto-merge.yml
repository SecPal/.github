              return;
            }
            if (updateType) core.setOutput('update-type', updateType);
            core.setOutput('base', pr.base.sha);
            core.setOutput('workflow-write', files.some(file =>
              file.filename.startsWith('.github/workflows/') ||
              file.previous_filename?.startsWith('.github/workflows/')) ? 'true' : 'false');
            core.setOutput('verified', 'true');

      - name: Check PR metadata
        id: check
        env:
          SOURCE_VERIFIED: ${{ steps.source.outputs.verified }}
          SHARED_CLASSIFICATION: ${{ steps.source.outputs.shared-classification }}
          PR_LABELS: ${{ steps.source.outputs.labels }}
          PHASE: ${{ inputs.phase }}
          METADATA_STEP_OUTCOME: ${{ steps.metadata.outcome }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
          UPDATE_TYPE_RAW: ${{ steps.source.outputs.update-type || steps.metadata.outputs.update-type }}
          SOURCE_UPDATE_TYPE: ${{ steps.source.outputs.update-type }}
          UPDATED_DEPENDENCIES_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          PREVIOUS_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
        run: |
          is_grouped_update() {
            [[ -n "${DEPENDENCY_GROUP}" || "${DEPENDENCY_NAMES}" == *,* ]]
          }

          is_reviewed_semver_group() {
            case "${DEPENDENCY_GROUP}:${PACKAGE_ECOSYSTEM}:${UPDATE_TYPE_RAW}" in
              github-actions-patch:github_actions:version-update:semver-patch | \
                github-actions-minor:github_actions:version-update:semver-minor | \
                github-actions-major:github_actions:version-update:semver-major)
                ;;
              *)
                [[ "${PACKAGE_ECOSYSTEM}" != "github_actions" &&
                  "${DEPENDENCY_GROUP}" != github-actions-* ]] || return 1
                ;;
            esac

            jq -e \
              --arg dependency_group "${DEPENDENCY_GROUP}" \
              --arg package_ecosystem "${PACKAGE_ECOSYSTEM}" \
              --arg update_type "${UPDATE_TYPE_RAW}" \
              '
                if type != "array" or length == 0 then
                  false
                else
                  all(
                    .[];
                    type == "object" and
                    .dependencyGroup == $dependency_group and
                    .packageEcosystem == $package_ecosystem and
                    .updateType == $update_type
                  )
                end
              ' <<<"${UPDATED_DEPENDENCIES_JSON}" >/dev/null
          }

          echo "PR Labels: ${PR_LABELS}"
          echo "Auto-merge Phase: ${PHASE}"
          echo "Metadata step outcome: ${METADATA_STEP_OUTCOME}"
          echo "Dependency names: ${DEPENDENCY_NAMES}"
          echo "Dependency group: ${DEPENDENCY_GROUP}"
          echo "Maintainer changes: ${MAINTAINER_CHANGES}"
          echo "Package ecosystem: ${PACKAGE_ECOSYSTEM}"
          echo "Dependabot update-type: ${UPDATE_TYPE_RAW}"
          echo "Updated dependencies JSON: ${UPDATED_DEPENDENCIES_JSON}"
          echo "Previous version: ${PREVIOUS_VERSION}"
          echo "New version: ${NEW_VERSION}"

          # Check if PR has 'dependencies' label (required for Dependabot PRs)
          if ! jq -e 'type == "array" and index("dependencies") != null' <<<"${PR_LABELS}" >/dev/null; then
            echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
            echo "update-type=missing-dependencies-label" >> "${GITHUB_OUTPUT}"
            echo "❌ Not eligible: Missing dependencies label"
            exit 0
          fi

          if [[ "${METADATA_STEP_OUTCOME}" != "success" ]]; then
            echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
            echo "update-type=metadata-unavailable" >> "${GITHUB_OUTPUT}"
            echo "❌ Not eligible: Dependabot metadata verification failed; route to manual review"
            exit 0
          fi

          if [[ "${SOURCE_VERIFIED}" != "true" ]]; then
            echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
            echo "update-type=unverified-source" >> "${GITHUB_OUTPUT}"
            if [[ -n "${SHARED_CLASSIFICATION:-}" ]]; then
              echo "Not eligible under shared component policy: ${SHARED_CLASSIFICATION}"
            else
              echo "Not eligible: source identity or changed paths could not be verified"
            fi
            exit 0
          fi

          if [[ "${MAINTAINER_CHANGES}" != "false" ]]; then
            echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
            echo "update-type=maintainer-changes" >> "${GITHUB_OUTPUT}"
            echo "❌ Not eligible: Dependabot PR includes maintainer changes"
            exit 0
          fi

          # fetch-metadata reports only the highest aggregate update type.
          # Verify every JSON member against the reviewed group/type contract;
          # unknown, unversioned, mixed, or mismatched groups fail closed.
          if [[ "${PACKAGE_ECOSYSTEM}" != docker && "${SOURCE_UPDATE_TYPE:-}" != shared-sha-no-op ]] &&
            [[ "${PACKAGE_ECOSYSTEM}" != pip || -z "${SOURCE_UPDATE_TYPE:-}" ]] &&
            is_grouped_update && ! is_reviewed_semver_group; then
            echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
            echo "update-type=grouped-update" >> "${GITHUB_OUTPUT}"
            echo "❌ Not eligible: Dependabot group is not a reviewed homogeneous semver group"
            exit 0
          fi

          case "${UPDATE_TYPE_RAW}" in
            shared-sha-no-op)
              echo "update-type=shared-sha-no-op" >> "${GITHUB_OUTPUT}"
              if [[ "${PACKAGE_ECOSYSTEM}" == github_actions && "${SOURCE_UPDATE_TYPE:-}" == shared-sha-no-op &&
                ( "${PHASE}" == 1 || "${PHASE}" == 2 || "${PHASE}" == 3 ) ]]; then
                echo "should-auto-merge=true" >> "${GITHUB_OUTPUT}"
              else
                echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
              fi
              ;;
            digest-refresh)
              echo "update-type=digest-refresh" >> "${GITHUB_OUTPUT}"
              if [[ "${PACKAGE_ECOSYSTEM}" == docker && ( "${PHASE}" == 2 || "${PHASE}" == 3 ) ]]; then
                echo "should-auto-merge=true" >> "${GITHUB_OUTPUT}"
              else
                echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
              fi
              ;;
            version-update:semver-major)
              echo "update-type=major" >> "${GITHUB_OUTPUT}"
              echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
              echo "❌ Not eligible: MAJOR semver update requires manual review (Phase ${PHASE})"
              ;;
            version-update:semver-minor)
              echo "update-type=minor" >> "${GITHUB_OUTPUT}"
              if [[ "${PHASE}" == "2" || "${PHASE}" == "3" ]]; then
                echo "should-auto-merge=true" >> "${GITHUB_OUTPUT}"
                echo "✅ Eligible for auto-merge (Phase ${PHASE}): MINOR semver update"
              else
                echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
                echo "❌ Not eligible: MINOR semver update requires manual review (Phase ${PHASE})"
              fi
              ;;
            version-update:semver-patch)
              echo "update-type=patch" >> "${GITHUB_OUTPUT}"
              echo "should-auto-merge=true" >> "${GITHUB_OUTPUT}"
              echo "✅ Eligible for auto-merge (Phase ${PHASE}): PATCH semver update"
              ;;
            "")
              echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
              if [[ "${PACKAGE_ECOSYSTEM}" == "github_actions" ]] &&
                [[ -n "${PREVIOUS_VERSION}" && -n "${NEW_VERSION}" ]]; then
                echo "update-type=github-actions-non-semver" >> "${GITHUB_OUTPUT}"
                echo "❌ Not eligible: GitHub Actions reference update does not expose a semver update-type"
              else
                echo "update-type=metadata-unavailable" >> "${GITHUB_OUTPUT}"
                echo "❌ Not eligible: Dependabot metadata did not include an update type"
              fi
              ;;
            *)
              echo "should-auto-merge=false" >> "${GITHUB_OUTPUT}"
              echo "update-type=non-semver" >> "${GITHUB_OUTPUT}"
              echo "❌ Not eligible: Unsupported Dependabot update type '${UPDATE_TYPE_RAW}'"
              ;;
          esac

  source-safety:
    name: Dependabot Source Safety
    needs: check-eligibility
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # GitHub requires repository write access to disable auto-merge.
      contents: write
      pull-requests: write
    outputs:
      check-run-id: ${{ steps.identity.outputs.check-run-id }}
    steps:
      - name: Reconcile automated enrollment against this exact head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ELIGIBLE: >-
            ${{ needs.check-eligibility.result == 'success' &&
                needs.check-eligibility.outputs.should-auto-merge == 'true' && inputs.merge-method == 'squash' }}
          POLICY_REJECTION: ${{ needs.check-eligibility.outputs.policy-rejection }}
          PUBLISHER_EVENTS: ${{ inputs.publisher-events }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const expected = context.payload.pull_request.head.sha;
            const read = async () => {
              const pr = (await github.rest.pulls.get({ owner, repo, pull_number })).data;
              if (pr.head.sha !== expected || pr.state !== 'open' ||
                  !Object.hasOwn(pr, 'auto_merge') || !Array.isArray(pr.labels) ||
                  (pr.auto_merge && !pr.auto_merge.enabled_by?.login)) {
                throw new Error('Current PR enrollment identity is unavailable or changed');
              }
              return pr;
            };
            const legacy = 'github-actions[bot]';
            const merger = 'secpal-dependabot-merger[bot]';
            const managed = new Set([legacy, merger]);
            const wanted = process.env.PUBLISHER_EVENTS === 'true' ? merger : legacy;
            const pr = await read();
            const enrolledBy = pr.auto_merge?.enabled_by.login;
            if (pr.user.login === 'dependabot[bot]' && managed.has(enrolledBy) &&
                (enrolledBy !== wanted || process.env.ELIGIBLE !== 'true' ||
                  !pr.labels.some(label => label.name === 'dependencies') ||
                  pr.base.ref !== 'main' || pr.draft || pr.auto_merge.merge_method !== 'squash')) {
              await github.graphql('mutation($id: ID!) { disablePullRequestAutoMerge(input: {pullRequestId: $id}) { clientMutationId } }',
                { id: pr.node_id });
              if (managed.has((await read()).auto_merge?.enabled_by.login)) {
                throw new Error('Unsafe automated enrollment is still active');
              }
            }
            if (pr.user.login === 'dependabot[bot]' && process.env.POLICY_REJECTION) {
              throw new Error(process.env.POLICY_REJECTION);
            }

      - name: Record the native safety check identity
        id: identity
        env:
          CHECK_RUN_ID: ${{ job.check_run_id }}
        run: printf 'check-run-id=%s\n' "$CHECK_RUN_ID" >> "$GITHUB_OUTPUT"

  # Enrollment is informational; branch protection owns quality admission.
  auto-merge:
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    needs: [check-eligibility, source-safety]
    if: needs.check-eligibility.outputs.should-auto-merge == 'true'
    timeout-minutes: 20
    steps:
      - name: Preserve existing operator enrollment
        id: enrollment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = (await github.rest.pulls.get({ ...context.repo,
              pull_number: context.payload.pull_request.number })).data;
            if (pr.head.sha !== context.payload.pull_request.head.sha || pr.base.ref !== 'main' ||
                pr.state !== 'open' || pr.draft || !Object.hasOwn(pr, 'auto_merge') ||
                !Array.isArray(pr.labels)) throw new Error('PR changed');
            core.setOutput('required', pr.auto_merge === null &&
              pr.labels.some(label => label.name === 'dependencies') ? 'true' : 'false');

      - name: Mint a token for the current publisher repository
        if: >-
          steps.enrollment.outputs.required == 'true' && inputs.publisher-events &&
          contains(fromJSON('["SecPal/api","SecPal/frontend","SecPal/secpal.app"]'), github.repository)
        id: merger-app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.DEPENDABOT_MERGER_APP_ID }}
          private-key: ${{ secrets.dependabot-merger-private-key }}
          owner: SecPal
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: ${{ needs.check-eligibility.outputs.workflow-write == 'true' && 'write' || '' }}

      - name: Enable auto-merge
        if: steps.enrollment.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHER_EVENTS: ${{ inputs.publisher-events }}
          MERGER_APP: ${{ steps.merger-app.outputs.app-slug }}
          MERGER_TOKEN: ${{ steps.merger-app.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ needs.check-eligibility.outputs.verified-base }}
          SAFETY_CHECK_ID: ${{ needs.source-safety.outputs.check-run-id }}
        run: |
          set -euo pipefail
          reject() {
            printf '%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          }
          [[ "$SAFETY_CHECK_ID" =~ ^[1-9][0-9]*$ && "$EXPECTED_BASE" =~ ^[a-f0-9]{40}$ ]] ||
            reject 'The verified base or native Source Safety check identity is missing.'

          # The completed job can take time to appear in GitHub's PR check rollup.
          # Retry only absent or pending evidence for the exact check this run produced.
          delay=2
          for attempt in 1 2 3 4 5; do
            checks=$(gh api graphql --paginate --slurp \
              -f owner="${GITHUB_REPOSITORY%%/*}" -f repository="${GITHUB_REPOSITORY#*/}" -F number="$PR_NUMBER" \
              -f query='
                query($owner: String!, $repository: String!, $number: Int!, $endCursor: String) {
                  repository(owner: $owner, name: $repository) {
                    pullRequest(number: $number) {
                      headRefOid baseRefOid baseRefName state isDraft
                      commits(last: 1) {
                        nodes {
                          commit {
                            oid
                            statusCheckRollup {
                              contexts(first: 100, after: $endCursor) {
                                pageInfo { hasNextPage endCursor }
                                nodes {
                                  ... on CheckRun {
                                    databaseId name status conclusion detailsUrl isRequired(pullRequestNumber: $number)
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }') || reject 'GitHub could not read the required Source Safety check.'
            check_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/job/${SAFETY_CHECK_ID}"
            result=$(jq -er --arg head "$EXPECTED_HEAD" --arg base "$EXPECTED_BASE" \
              --arg id "$SAFETY_CHECK_ID" --arg url "$check_url" '
              map(.data.repository.pullRequest) |
              if length == 0 or any(.[]; .headRefOid != $head or .baseRefOid != $base or
                  .baseRefName != "main" or .state != "OPEN" or .isDraft != false or
                  .commits.nodes[0].commit.oid != $head) then "changed"
              else
                [.[] | .commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]? |
                  select((.databaseId | tostring) == $id)] |
                if length == 0 then "pending"
                elif length != 1 or .[0].isRequired != true or
                  .[0].name != "auto-merge / Dependabot Source Safety" or .[0].detailsUrl != $url then "invalid"
                elif .[0].status != "COMPLETED" then "pending"
                elif .[0].conclusion == "SUCCESS" then "verified"
                else "invalid" end
              end
            ' <<< "$checks") || reject 'GitHub returned invalid Source Safety check evidence.'
            case "$result" in
              verified) break ;;
              changed) reject 'The PR head, base or state changed after Source Safety verification.' ;;
              invalid) reject "Check $SAFETY_CHECK_ID is not the unique successful required Source Safety check." ;;
            esac
            if [[ "$attempt" != 5 ]]; then
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          [[ "$result" == verified ]] ||
            reject "GitHub did not report a completed required Source Safety check ($SAFETY_CHECK_ID) within the retry window."
          echo "🤖 Enabling auto-merge..."
          echo "PR: ${PR_URL}"
          echo "Update type: ${{ needs.check-eligibility.outputs.update-type }}"
          echo "Merge method: ${MERGE_METHOD}"
          echo "Phase: ${{ inputs.phase }}"

          merge_token="$GH_TOKEN"
          if [[ "${PUBLISHER_EVENTS:-false}" == true ]]; then
            [[ "${MERGER_APP:-}" == secpal-dependabot-merger && -n "${MERGER_TOKEN:-}" ]] ||
              reject 'The scoped SecPal merger App token is missing or belongs to another App.'
            merge_token="$MERGER_TOKEN"
          fi
          # The workflow token reads required checks; the selected identity enrolls the PR.
          case "${MERGE_METHOD}" in
            squash)
              GH_TOKEN="$merge_token" gh pr merge --auto --squash --match-head-commit "${EXPECTED_HEAD}" "${PR_URL}"
              ;;
            *)
              echo "❌ Invalid merge method: ${MERGE_METHOD}"
              exit 1
              ;;
          esac

          echo "✅ Auto-merge enabled! PR will merge when all checks pass."

  # Report decisions in the run, avoiding stale or repeated PR comments.
  skip-auto-merge:
    name: Skip Auto-Merge
    runs-on: ubuntu-latest
    needs: check-eligibility
    if: >-
      needs.check-eligibility.outputs.should-auto-merge != 'true' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record the decision
        env:
          UPDATE_TYPE: ${{ needs.check-eligibility.outputs.update-type }}
          POLICY_REJECTION: ${{ needs.check-eligibility.outputs.policy-rejection }}
        run: |
          if [[ -n "$POLICY_REJECTION" ]]; then
            printf '%s\n' "$POLICY_REJECTION" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Manual review required (%s).\n' "$UPDATE_TYPE" >> "$GITHUB_STEP_SUMMARY"
          fi
