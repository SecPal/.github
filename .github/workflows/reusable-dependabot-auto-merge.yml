---
# Reusable Dependabot Auto-Merge Workflow
# Automatically merges Dependabot PRs based on configurable phase/policy
#
# Usage in other repositories (explicit caller ceiling; reads cannot be added
# by a reusable workflow when the caller grants none):
#   permissions:
#     contents: write
#     pull-requests: write
#     checks: read
#     statuses: read
#     attestations: read
#   jobs:
#     auto-merge:
#       uses: SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml@<trusted-commit-sha>
#       with:
#         phase: "1"  # Optional: 1 (PATCH only), 2 or 3 (PATCH+MINOR)
#
# For cross-repository callers, pin to a reviewed immutable commit SHA. A
# moving branch ref or stale tag can silently preserve obsolete behavior.
#
# Callers must reconcile all PR head, label, draft and target changes. Require
# source-safety before any enrollment (including phase 1);
# enrollment remains informational and manual operator requests stay untouched.
#
# Strategy:
#   Phase 1 (default): PATCH updates auto-merge ✅, MINOR/MAJOR require review
#   Phase 2: PATCH + MINOR auto-merge ✅, MAJOR requires review
#   Phase 3: PATCH + MINOR auto-merge ✅, MAJOR requires review
#
# Rollback strategy: Git revert the auto-merged commit if issues occur

name: Reusable Dependabot Auto-Merge

on:
  workflow_call:
    inputs:
      phase:
        description: "Auto-merge phase: 1 (PATCH only), 2 or 3 (PATCH+MINOR)"
        required: false
        default: "1"
        type: string
      allowed-ecosystems:
        description: "Verified dependency ecosystems allowed for this caller (comma-separated)"
        required: false
        type: string
        default: "github_actions,npm_and_yarn,composer,gradle,bundler"
      workflow-paths:
        description: "Optional JSON allowlist of Actions workflow paths; empty means all workflow files"
        required: false
        type: string
        default: "[]"
      shared-sha-workflow-paths:
        description: "Deprecated compatibility input. Internal updates are verified from the exact caller diff."
        type: string
        default: "[]"
      pip-manifest-path:
        description: "Optional exact hash-locked requirements file for callers with required native qualification"
        required: false
        type: string
        default: ""
      pip-plain-manifest-paths:
        description: "Exact requirements files for a repository with required native installation checks"
        type: string
        default: "[]"
      gradle-wrapper-path:
        description: "Exact Gradle wrapper properties path for checksum-verified patches"
        type: string
        default: ""
      pre-commit-path:
        description: "Optional exact .pre-commit-config.yaml path for authenticated hook updates"
        type: string
        default: ""
      docker-rules:
        description: "Explicit image, Containerfile paths, numeric release line, tag suffix, digestRefresh opt-in and enforceLine opt-in"
        type: string
        default: "[]"
      merge-method:
        description: "Automatic merge method: squash"
        required: false
        default: "squash"
        type: string
      publisher-events:
        description: "Use the scoped SecPal merger App for repositories with downstream push workflows"
        default: false
        type: boolean
    secrets:
      dependabot-merger-private-key:
        required: false

# Enrollment uses no Actions cache; prevent cache access across the reusable call.
cache-mode: none

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  attestations: read

jobs:
  # Determine if this PR is eligible for auto-merge
  check-eligibility:
    name: Check Auto-Merge Eligibility
    runs-on: ubuntu-latest
    # Gate on the PR author rather than the event actor so maintainer-triggered
    # `reopened` and `ready_for_review` events on Dependabot-authored PRs do not
    # skip auto-merge enrollment. See:
    # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#enable-auto-merge-on-a-pull-request
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      attestations: read
    outputs:
      should-auto-merge: ${{ steps.check.outputs.should-auto-merge }}
      update-type: ${{ steps.check.outputs.update-type }}
      policy-rejection: ${{ steps.source.outputs.policy-rejection }}
      verified-base: ${{ steps.source.outputs.base }}
      workflow-write: ${{ steps.source.outputs.workflow-write }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        continue-on-error: true
        with:
          github-token: "${{ github.token }}"

      - name: Verify Dependabot source boundary
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          ALLOWED_ECOSYSTEMS: ${{ inputs.allowed-ecosystems }}
          VERIFIED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
          WORKFLOW_PATHS: ${{ inputs.workflow-paths }}
          GH_TOKEN: ${{ github.token }}
          VERIFIER_REVISION: ${{ fromJSON(toJSON(job)).workflow_sha }}
          PIP_MANIFEST_PATH: ${{ inputs.pip-manifest-path }}
          PIP_PLAIN_MANIFEST_PATHS: ${{ inputs.pip-plain-manifest-paths }}
          GRADLE_WRAPPER_PATH: ${{ inputs.gradle-wrapper-path }}
          PRE_COMMIT_PATH: ${{ inputs.pre-commit-path }}
          DOCKER_RULES: ${{ inputs.docker-rules }}
        with:
          script: |
            core.setOutput('verified', 'false');
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const expected = context.payload.pull_request.head.sha;
            const read = async () => (await github.rest.pulls.get({ owner, repo, pull_number })).data;
            const pr = await read();
            core.setOutput('labels', JSON.stringify(pr.labels?.map(label => label.name) || []));
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.draft ||
                pr.user.login !== 'dependabot[bot]' || pr.user.type !== 'Bot' ||
                pr.head.repo?.full_name !== `${owner}/${repo}` || pr.head.sha !== expected) return;
            const ecosystem = process.env.PACKAGE_ECOSYSTEM;
            if (!process.env.ALLOWED_ECOSYSTEMS.split(',').includes(ecosystem)) return;
            const verifiedDependencies = JSON.parse(process.env.VERIFIED_DEPENDENCIES || 'null');
            if (!Array.isArray(verifiedDependencies) || !verifiedDependencies.length) return;
            const sharedSyntax = /^SecPal\/\.github(?:\/|$)/i;
            const shared = ecosystem === 'github_actions' &&
              verifiedDependencies.some(item => sharedSyntax.test(item?.dependencyName));
            if (shared) {
              core.setOutput('shared-classification', 'UNVERIFIABLE');
              if (verifiedDependencies.some(item => !sharedSyntax.test(item?.dependencyName))) return;
            }
            // Branch-derived metadata is not path authorization. Read only the
            // accepted base configuration; never load code from the PR head.
            let config;
            try {
              config = (await github.rest.repos.getContent({ owner, repo,
                path: '.github/dependabot.yml', ref: pr.base.sha })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              config = (await github.rest.repos.getContent({ owner, repo,
                path: '.github/dependabot.yaml', ref: pr.base.sha })).data;
            }
            if (config.type !== 'file' || config.encoding !== 'base64' || !config.content) return;
            const configured = require('node:child_process').spawnSync('ruby', ['-rjson', '-ryaml', '-e', String.raw`
              begin
                input = JSON.parse(STDIN.read)
                config = YAML.safe_load(input.fetch('config'), permitted_classes: [], permitted_symbols: [], aliases: false)
                raise 'unsupported config' unless config.fetch('version') == 2
                matching = config.fetch('updates').select do |entry|
                  entry.fetch('package-ecosystem') == input.fetch('ecosystem') &&
                    entry.fetch('target-branch', input.fetch('default_branch')) == input.fetch('target')
                end
                directories = matching.flat_map { |entry| entry.key?('directories') ? entry.fetch('directories') : [entry.fetch('directory')] }
                pip_groups = matching.flat_map do |entry|
                  next [] unless input.fetch('ecosystem') == 'pip'
                  entry.fetch('groups', {}).filter_map do |name, group|
                    next unless group['group-by'] == 'dependency-name' &&
                      group.fetch('applies-to', 'version-updates') == 'version-updates'
                    { name: name, multipleDirectories: entry.key?('directories') }
                  end
                end
                print JSON.generate({ directories: directories, pipGroups: pip_groups })
              rescue StandardError
                exit 1
              end
            `], { input: JSON.stringify({ config: Buffer.from(config.content, 'base64').toString('utf8'),
              ecosystem: ({ npm_and_yarn: 'npm', github_actions: 'github-actions', pre_commit: 'pre-commit' })[ecosystem] || ecosystem,
              target: pr.base.ref, default_branch: context.payload.repository.default_branch }),
              encoding: 'utf8', env: { PATH: process.env.PATH }, timeout: 10000, maxBuffer: 1024 * 1024 });
            if (configured.status !== 0) return;
            const { directories, pipGroups } = JSON.parse(configured.stdout);
            // Exact paths only; unsupported globs and noncanonical paths fail closed.
            if (!Array.isArray(directories) || !directories.length || !directories.every(directory =>
                typeof directory === 'string' && (directory === '/' ||
                  /^\/(?:[A-Za-z0-9_.-]+\/)*[A-Za-z0-9_.-]+$/.test(directory) &&
                  directory.split('/').every(part => part !== '.' && part !== '..')))) return;
            const prefixes = directories.map(directory => directory === '/' ? '' : directory.slice(1) + '/');
            const manifests = {
              npm_and_yarn: ['package.json', 'package-lock.json', 'npm-shrinkwrap.json', 'yarn.lock', 'pnpm-lock.yaml'],
              composer: ['composer.json', 'composer.lock'],
              bundler: ['Gemfile', 'Gemfile.lock'],
              gradle: ['build.gradle', 'build.gradle.kts', 'settings.gradle', 'settings.gradle.kts',
                'variables.gradle', 'gradle/libs.versions.toml', 'app/build.gradle', 'app/build.gradle.kts',
                'app/gradle.lockfile', 'dpc/build.gradle', 'dpc/gradle.lockfile'],
            };
            const workflowPaths = JSON.parse(process.env.WORKFLOW_PATHS || '[]');
            if (!Array.isArray(workflowPaths) || !workflowPaths.every(path =>
                typeof path === 'string' && /^\.github\/workflows\/[^/]+\.ya?ml$/.test(path))) return;
            const pipPath = process.env.PIP_MANIFEST_PATH;
            const plainPaths = ecosystem === 'pip' ? JSON.parse(process.env.PIP_PLAIN_MANIFEST_PATHS || '[]') : [];
            if (!Array.isArray(plainPaths) || (plainPaths.length &&
                (pipPath || plainPaths.length !== new Set(plainPaths).size || plainPaths.length !== directories.length ||
                 plainPaths.some(path => typeof path !== 'string' ||
                   !/^requirements\/(?:[a-z][a-z0-9-]*\/)?requirements\.txt$/.test(path) ||
                   !prefixes.some(prefix => path === prefix + 'requirements.txt'))))) return;
            const isWrapper = ecosystem === 'gradle' &&
              verifiedDependencies.some(dependency => dependency?.dependencyName === 'gradle-wrapper');
            const wrapperPath = isWrapper && process.env.GRADLE_WRAPPER_PATH;
            if (isWrapper && !wrapperPath) return;
            if (ecosystem === 'gradle' && !isWrapper && verifiedDependencies.some(dependency =>
                dependency?.packageEcosystem !== ecosystem || typeof dependency.newVersion !== 'string' ||
                !/^(?:0|[1-9]\d*)(?:\.(?:0|[1-9]\d*)){1,3}$/.test(dependency.newVersion) ||
                (dependency.newVersion.startsWith('0.') && dependency.updateType !== 'version-update:semver-patch'))) return;
            const rules = ecosystem === 'docker' ? JSON.parse(process.env.DOCKER_RULES || '[]') : [];
            if (!Array.isArray(rules) || !rules.every(rule => rule && Array.isArray(rule.paths))) return;
            const matchingRules = rules.filter(rule => rule.image === verifiedDependencies[0]?.dependencyName);
            if (ecosystem === 'docker' && matchingRules.length !== 1) return;
            const [dockerRule] = matchingRules;
            const allowed = path => typeof path === 'string' && (ecosystem === 'github_actions'
              ? /^\.github\/workflows\/[^/]+\.ya?ml$/.test(path) &&
                directories.includes('/') && (shared || !workflowPaths.length || workflowPaths.includes(path))
              : prefixes.some(prefix => ecosystem === 'pip'
                ? (plainPaths.includes(path) && path === prefix + 'requirements.txt') ||
                  (path === pipPath && path.startsWith(prefix) && /^[A-Za-z0-9_.-]*requirements[A-Za-z0-9_.-]*\.txt$/.test(path.slice(prefix.length)))
                : wrapperPath ? path === wrapperPath && path === prefix + 'gradle/wrapper/gradle-wrapper.properties'
                : ecosystem === 'pre_commit' ? path === process.env.PRE_COMMIT_PATH && path === prefix + '.pre-commit-config.yaml'
                : ecosystem === 'docker' ? path === prefix + 'Containerfile' && dockerRule?.paths?.includes(path)
                : (manifests[ecosystem] || []).some(name => path === prefix + name)));
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number, per_page: 100 });
            if (!files.length || files.length !== pr.changed_files ||
                !files.every(file => allowed(file.filename) && (!file.previous_filename || allowed(file.previous_filename)))) return;
            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number, per_page: 100 });
            // fetch-metadata classifies the first commit; require it to be the exact head.
            if (commits.length !== 1 || commits.length !== pr.commits || commits[0].sha !== expected ||
                !commits.every(commit => commit.author?.login === 'dependabot[bot]' &&
                  ['web-flow', 'dependabot[bot]'].includes(commit.committer?.login) &&
                  commit.commit.verification?.verified === true && commit.parents.length === 1)) return;
            // fetch-metadata can calculate a missing class using a mutable PR
            // title. Use the signed class or derive it from verified hook refs.
            const proof = require('node:child_process').spawnSync('ruby', ['-rjson', '-ryaml', '-e', String.raw`
              begin
                input = JSON.parse(STDIN.read)
                fragment = input.fetch('message')[/^---\n([\s\S]*?)\n^\.\.\.\n/m, 1]
                metadata = YAML.safe_load(fragment, permitted_classes: [], permitted_symbols: [], aliases: false)
                dependencies = metadata.fetch('updated-dependencies')
                verified = input.fetch('verified')
                types = %w[version-update:semver-patch version-update:semver-minor version-update:semver-major]
                valid = dependencies.is_a?(Array) && verified.is_a?(Array) && !dependencies.empty? &&
                  dependencies.length == verified.length && dependencies.each_with_index.all? do |dependency, index|
                    expected = verified[index]
                    dependency.is_a?(Hash) && expected.is_a?(Hash) &&
                      dependency['dependency-name'] == expected['dependencyName'] &&
                      (%w[pre_commit shared_sha].include?(input.fetch('ecosystem')) ||
                        (types.include?(dependency['update-type']) && dependency['update-type'] == expected['updateType'])) &&
                      (!%w[pip pre_commit docker gradle gradle_wrapper shared_sha].include?(input.fetch('ecosystem')) ||
                        (dependency['dependency-version'].is_a?(String) && dependency['dependency-version'] == expected['newVersion'])) &&
                      (!input.fetch('plain_pip') || dependency.fetch('dependency-group', '') == expected['dependencyGroup'])
                  end
                print(valid ? JSON.generate(dependencies) : 'false')
              rescue StandardError
                print 'false'
              end
            `], { input: JSON.stringify({ message: commits[0].commit.message,
              verified: verifiedDependencies, ecosystem: shared ? 'shared_sha' : wrapperPath ? 'gradle_wrapper' : ecosystem,
              plain_pip: plainPaths.length > 0 }),
              encoding: 'utf8', env: { PATH: process.env.PATH }, timeout: 10000, maxBuffer: 1024 * 1024 });
            if (proof.status !== 0 || proof.stdout === 'false') return;
            const signedDependencies = JSON.parse(proof.stdout);
            const numeric = /^(?:v)?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
            const pythonRelease = /^(0|[1-9]\d*)\.(0|[1-9]\d*)(?:\.(0|[1-9]\d*)(?:\.(0|[1-9]\d*))?)?$/;
            const classify = (before, after, format = numeric) => {
              const old = format.exec(before), next = format.exec(after);
              if (!old || !next || old[1] !== next[1]) return '';
              if (BigInt(next[2]) > BigInt(old[2])) return 'version-update:semver-minor';
              if (old[2] !== next[2]) return '';
              const oldPatch = BigInt(old[3] ?? 0), nextPatch = BigInt(next[3] ?? 0);
              const revisionIncreased = nextPatch === oldPatch && BigInt(next[4] ?? 0) > BigInt(old[4] ?? 0);
              return nextPatch > oldPatch || revisionIncreased ? 'version-update:semver-patch' : '';
            };
            const readExact = async (path, ref, blob) => {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref });
              if (data.type !== 'file' || data.encoding !== 'base64' || !data.content || (blob && data.sha !== blob)) return null;
              return Buffer.from(data.content, 'base64').toString('utf8');
            };
            const treeAt = async (ref, repository = { owner, repo }) => {
              const { data: commit } = await github.rest.git.getCommit({ ...repository, commit_sha: ref });
              if (commit.sha !== ref) return null;
              const { data } = await github.rest.git.getTree({ ...repository, tree_sha: commit.tree.sha, recursive: '1' });
              return data?.truncated === false ? new Map(data.tree.map(entry => [entry.path, entry])) : null;
            };
            if (ecosystem === 'gradle' && !isWrapper) {
              if (commits[0].parents[0].sha !== pr.base.sha || files.some(file =>
                file.status !== 'modified' || file.previous_filename || !/^[a-f0-9]{40}$/.test(file.sha))) return;
              const before = await treeAt(pr.base.sha), after = await treeAt(expected);
              if (!before || !after || files.some(file => {
                const old = before.get(file.filename), next = after.get(file.filename);
                return old?.mode !== '100644' || next?.mode !== '100644' ||
                  old.sha === next.sha || next.sha !== file.sha;
              })) return;
            }
            let updateType;
            let policyRejection;
            let sharedClassification;
            if (shared) {
              const upstream = { owner: 'SecPal', repo: '.github' };
              const prefix = 'SecPal/.github/';
              const digest = /^[a-f0-9]{40}$/;
              const releaseVersion = /^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/;
              const workflowPath = /^\.github\/workflows\/[a-z0-9_-]+\.ya?ml$/;
              const actionPath = /^\.github\/actions\/(?:[a-z0-9_-]+\/)*[a-z0-9_-]+$/;
              const authorityWorkflow = '.github/workflows/reusable-dependabot-auto-merge.yml';
              const callerAuthority = '.github/workflows/dependabot-auto-merge.yml';
              const scanner = '.github/actions/trivy-repository-scan';
              const workflows = '.github/workflows/reusable-';
              const npmFiles = ['package.json', 'package-lock.json'];
              // Compare the reviewed execution roots directly. The immutable
              // verifier tree binds each root to the reviewed implementation.
              const bound = new Map([
                [scanner, ['scripts/secpal-trivy-repository-scan.py',
                  'policies/trivy-repository-scan-v1.json',
                  'policies/trivy-repository-scan-ignore-v1.yaml',
                  'policies/trivy-repository-secret-v1.yaml']],
                [workflows + 'markdown-lint.yml', npmFiles],
                [workflows + 'ai-instructions.yml', [...npmFiles, 'scripts/validate-ai-instructions.sh']],
                [workflows + 'dependabot-manifest-coverage.yml', [...npmFiles,
                  'scripts/secpal-dependabot-manifest-coverage.mjs',
                  'policies/dependabot-manifest-catalog-v1.json']],
              ]);
              const callerOnly = new Set([
                'actionlint', 'check-conflict-markers', 'license-compatibility', 'node-build',
                'node-lint', 'node-test', 'php-lint', 'php-stan', 'pr-size', 'prettier', 'reuse',
              ].map(name => workflows + name + '.yml'));
              const classes = ['VERIFIED_NO_OP', 'IMPLEMENTATION_CHANGED', 'AUTHORITY_CHANGED', 'UNVERIFIABLE'];
              const combine = (left, right) => classes[Math.max(classes.indexOf(left), classes.indexOf(right))];
              const dependencies = new Map();
              for (const item of verifiedDependencies) {
                const { dependencyName: name, newVersion, packageEcosystem } = item;
                const path = name.slice(prefix.length);
                if (!name.startsWith(prefix) || (!workflowPath.test(path) && !actionPath.test(path)) ||
                    (!digest.test(newVersion) && !releaseVersion.test(newVersion)) || packageEcosystem !== 'github_actions' || dependencies.has(name)) return;
                dependencies.set(name, { ...item, path });
              }
              if (commits[0].parents[0].sha !== pr.base.sha || files.some(file =>
                  file.status !== 'modified' || file.previous_filename || !digest.test(file.sha))) return;
              const { data: main } = await github.rest.repos.getBranch({ ...upstream, branch: 'main' });
              if (main.name !== 'main' || main.protected !== true || !digest.test(main.commit?.sha)) return;
              const { data: callerMain } = repo === upstream.repo && owner === upstream.owner
                ? { data: main } : await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              if (callerMain.name !== 'main' || callerMain.protected !== true ||
                  callerMain.commit?.sha !== pr.base.sha) return;
              const trees = new Map();
              const ancestry = new Map();
              const getTree = async ref => {
                if (!trees.has(ref)) trees.set(ref, treeAt(ref, upstream));
                return trees.get(ref);
              };
              const isAncestor = async (ancestor, descendant) => {
                if (ancestor === descendant) return true;
                const basehead = ancestor + '...' + descendant;
                if (!ancestry.has(basehead)) {
                  const { data } = await github.rest.repos.compareCommitsWithBasehead({ ...upstream, basehead, per_page: 1 });
                  ancestry.set(basehead, data?.status === 'ahead' && data.merge_base_commit?.sha === ancestor);
                }
                return ancestry.get(basehead);
              };
              const verifier = process.env.VERIFIER_REVISION;
              if (!digest.test(verifier) || !await isAncestor(verifier, main.commit.sha)) return;
              const reviewed = await getTree(verifier);
              if (!reviewed) return;
              const verifiedReleases = new Map();
              const verifyRelease = async (tag, sha) => {
                if (verifiedReleases.has(tag)) return verifiedReleases.get(tag) === sha;
                try {
                  const { data: release } = await github.rest.repos.getReleaseByTag({ ...upstream, tag });
                  if (release.tag_name !== tag || release.target_commitish !== sha || release.immutable !== true ||
                      release.draft !== false || release.prerelease !== false) return false;
                  const { data: ref } = await github.rest.git.getRef({ ...upstream, ref: 'tags/' + tag });
                  if (ref.object?.type !== 'commit' || ref.object.sha !== sha) return false;
                  const repoName = upstream.owner + '/' + upstream.repo;
                  const result = require('node:child_process').execFileSync('gh',
                    ['release', 'verify', tag, '--repo', repoName, '--format', 'json'],
                    { encoding: 'utf8', timeout: 30000, maxBuffer: 1024 * 1024 });
                  const statement = JSON.parse(result).verificationResult?.statement;
                  const subject = statement?.subject?.filter(subject => subject.uri === 'pkg:github/' + repoName + '@' + tag);
                  if (statement?.predicateType !== 'https://in-toto.io/attestation/release/v0.2' ||
                      statement.predicate?.repository !== repoName || statement.predicate.tag !== tag ||
                      statement.predicate.databaseId !== String(release.id) ||
                      subject?.length !== 1 || subject[0].digest?.sha1 !== sha) return false;
                  verifiedReleases.set(tag, sha);
                  return true;
                } catch {
                  return false;
                }
              };
              const same = (left, right) => left?.mode === right?.mode && left?.sha === right?.sha;
              const regular = entry => ['100644', '100755'].includes(entry?.mode) && digest.test(entry.sha);
              const inspect = async sha => {
                const { data } = await github.rest.git.getBlob({ ...upstream, file_sha: sha });
                if (data.sha !== sha || data.encoding !== 'base64' || !data.content) return null;
                const content = Buffer.from(data.content, 'base64');
                const parsed = require('node:child_process').spawnSync('ruby', ['-rjson', '-ryaml', '-e', String.raw`
                  begin
                    doc = YAML.safe_load(STDIN.read, permitted_classes: [], permitted_symbols: [], aliases: false)
                    authority = []
                    read_only = false
                    uses = if doc.key?('runs')
                      raise unless doc.fetch('runs').fetch('using') == 'composite'
                      doc.fetch('runs').fetch('steps').filter_map { |step| step['uses'] }
                    else
                      call = (doc['on'] || doc[true])&.fetch('workflow_call', nil)
                      authority << doc['permissions'] << call
                      read_permissions = ->(value) { value == 'read-all' || value.is_a?(Hash) && value.values.all? { |v| %w[read none].include?(v) } }
                      jobs = doc.fetch('jobs').values
                      read_only = read_permissions.call(doc['permissions']) && jobs.all? do |job|
                        !job['secrets'] && !job['environment'] && (!job.key?('permissions') || read_permissions.call(job['permissions']))
                      end
                      jobs.flat_map do |job|
