---
# SPDX-FileCopyrightText: 2025-2026 SecPal
# SPDX-License-Identifier: CC0-1.0

name: Reusable PR Size Check

on:
  workflow_call:
    inputs:
      max-lines:
        description: "Advisory changed-line threshold for reviewability"
        required: false
        type: number
        default: 600
      exclude-patterns:
        description: "Additional file patterns to exclude (comma-separated grep-compatible regex)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  pr-size:
    name: Check PR Size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check PR size
        env:
          ADVISORY_THRESHOLD: ${{ inputs.max-lines }}
          CUSTOM_EXCLUDE_PATTERNS: ${{ inputs.exclude-patterns }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Fetch base branch
          git fetch origin "$BASE_REF"

          # Calculate merge base
          MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD)

          # Keep raw path bytes and separate rename/copy source and destination paths.
          # Bash variables cannot store NUL bytes, so retain the diff in a temporary file.
          NUMSTAT_FILE=$(mktemp "${TMPDIR:-/tmp}/secpal-pr-size.XXXXXX")
          trap 'rm -f -- "$NUMSTAT_FILE"' EXIT
          git diff --numstat -z "$MERGE_BASE"..HEAD >"$NUMSTAT_FILE"
          EXCLUDE_REGEX=""
          CUSTOM_REGEX=""

          # Load exclude patterns from .preflight-exclude if it exists
          if [ -f ".preflight-exclude" ]; then
            # Extract non-comment, non-empty lines as grep-compatible regex patterns
            # Strip CR for Windows/CRLF compatibility
            EXCLUDE_PATTERNS=$(grep -vE '^[[:space:]]*(#|$)' ".preflight-exclude" | tr -d '\r' || true)

            if [ -n "$EXCLUDE_PATTERNS" ]; then
              # Build regex alternation for efficient filtering (patterns are used as-is)
              EXCLUDE_REGEX=$(echo "$EXCLUDE_PATTERNS" | tr '\n' '|' | sed 's/|$//')

              # NOTE: The regex validation logic below is duplicated from scripts/preflight.sh.
              # This duplication is necessary because GitHub Actions workflows
              # cannot reliably source external shell scripts.
              # If you update the validation logic here, you MUST also update
              # scripts/preflight.sh to keep them in sync.

              # Validate regex and warn about dangerous patterns
              # grep exit codes: 0=match, 1=no match, 2=error (invalid regex)
              set +e  # Temporarily disable exit-on-error to capture grep's exit code
              echo "" | grep -qE -- "$EXCLUDE_REGEX" 2>/dev/null
              GREP_EXIT=$?
              [[ "" =~ $EXCLUDE_REGEX ]]
              BASH_REGEX_EXIT=$?
              set -e  # Re-enable exit-on-error
              if [ $GREP_EXIT -ne 2 ] && [ $BASH_REGEX_EXIT -ne 2 ]; then
                # Pattern is valid (exit 0 or 1), check if it matches everything
                # Test against diverse filenames to detect overly broad patterns
                # Include various cases: lowercase, uppercase, numbers, special chars, hidden files
                if echo "test-file.txt" | grep -qE -- "$EXCLUDE_REGEX" && \
                   echo "another-file.js" | grep -qE -- "$EXCLUDE_REGEX" && \
                   echo "random.md" | grep -qE -- "$EXCLUDE_REGEX" && \
                   echo "README.md" | grep -qE -- "$EXCLUDE_REGEX" && \
                   echo "package.json" | grep -qE -- "$EXCLUDE_REGEX" && \
                   echo ".hidden" | grep -qE -- "$EXCLUDE_REGEX" && \
                   echo "File123.py" | grep -qE -- "$EXCLUDE_REGEX" && \
                   echo "UPPERCASE" | grep -qE -- "$EXCLUDE_REGEX"; then
                  echo "::warning::⚠️  .preflight-exclude contains pattern that matches EVERYTHING (e.g., '.*')"
                  echo "::warning::This will exclude all files from PR size calculation!"
                fi

              else
                # Invalid regex - grep failed even on empty input
                EXCLUDE_REGEX=""
                echo "::warning::⚠️  .preflight-exclude contains invalid regex pattern(s)"
                echo "::warning::The pattern will be ignored. Please check your .preflight-exclude file."
                echo "::warning::Common issues: unbalanced brackets [, unmatched (, trailing backslash \\"
              fi
            fi
          fi

          # Add custom exclude patterns if provided via input
          if [ -n "$CUSTOM_EXCLUDE_PATTERNS" ]; then
            IFS=',' read -ra CUSTOM_PATTERNS <<< "$CUSTOM_EXCLUDE_PATTERNS"

            # Validate and sanitize custom patterns: remove empty/comment patterns, trim whitespace, strip CR
            VALID_CUSTOM_PATTERNS=()
            for pattern in "${CUSTOM_PATTERNS[@]}"; do
              # Remove leading/trailing whitespace and CR
              pattern=$(echo "$pattern" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s/\r//g')
              # Skip empty or comment patterns
              if [ -n "$pattern" ] && [[ ! "$pattern" =~ ^# ]]; then
                VALID_CUSTOM_PATTERNS+=("$pattern")
              fi
            done

            if [ ${#VALID_CUSTOM_PATTERNS[@]} -gt 0 ]; then
              # Build regex alternation (patterns are used as-is, like .preflight-exclude)
              CUSTOM_REGEX=$(printf "%s|" "${VALID_CUSTOM_PATTERNS[@]}" | sed 's/|$//')

              # Validate custom patterns with same logic as .preflight-exclude
              set +e
              echo "" | grep -qE -- "$CUSTOM_REGEX" 2>/dev/null
              CUSTOM_GREP_EXIT=$?
              [[ "" =~ $CUSTOM_REGEX ]]
              CUSTOM_BASH_REGEX_EXIT=$?
              set -e

              if [ $CUSTOM_GREP_EXIT -eq 2 ] || [ $CUSTOM_BASH_REGEX_EXIT -eq 2 ]; then
                CUSTOM_REGEX=""
                echo "::warning::⚠️  Custom exclude patterns contain invalid regex"
                echo "::warning::Invalid patterns will be ignored. Check workflow input exclude-patterns."
              fi
            fi
          fi

          # With --numstat -z, a rename or copy has an empty path field followed
          # by separate source and destination paths. Match only the destination.
          RAW_RECORD_COUNT=0
          INCLUDED_RECORD_COUNT=0
          INSERTIONS=0
          DELETIONS=0
          while IFS= read -r -d '' record; do
            insertions=${record%%$'\t'*}
            remainder=${record#*$'\t'}
            deletions=${remainder%%$'\t'*}
            path=${remainder#*$'\t'}

            if [ -z "$path" ]; then
              if ! IFS= read -r -d '' _source_path || ! IFS= read -r -d '' path; then
                echo "::error::Malformed rename or copy record in git diff --numstat output"
                exit 1
              fi
            fi

            RAW_RECORD_COUNT=$((RAW_RECORD_COUNT + 1))
            if { [ -n "$EXCLUDE_REGEX" ] && [[ $path =~ $EXCLUDE_REGEX ]]; } || \
               { [ -n "$CUSTOM_REGEX" ] && [[ $path =~ $CUSTOM_REGEX ]]; }; then
              continue
            fi

            INCLUDED_RECORD_COUNT=$((INCLUDED_RECORD_COUNT + 1))
            if [[ $insertions =~ ^[0-9]+$ ]] && [[ $deletions =~ ^[0-9]+$ ]]; then
              INSERTIONS=$((INSERTIONS + insertions))
              DELETIONS=$((DELETIONS + deletions))
            elif [ "$insertions" != "-" ] || [ "$deletions" != "-" ]; then
              echo "::error::Malformed counts in git diff --numstat output"
              exit 1
            fi
          done <"$NUMSTAT_FILE"

          # Report when all files were filtered out, then continue with zero counts.
          if [ "$RAW_RECORD_COUNT" -gt 0 ] && [ "$INCLUDED_RECORD_COUNT" -eq 0 ]; then
            echo "⚠️  Warning: All changed files were excluded by filters"
            echo "This PR contains only lock files, license texts, or other excluded patterns"
          fi

          CHANGED=$((INSERTIONS + DELETIONS))
          SIZE_REPORT="PR size: $CHANGED changed lines ($INSERTIONS insertions, $DELETIONS deletions; advisory threshold: $ADVISORY_THRESHOLD)"

          echo "$SIZE_REPORT"

          if [ "$CHANGED" -gt "$ADVISORY_THRESHOLD" ]; then
            echo "::warning::PR size advisory threshold exceeded ($CHANGED > $ADVISORY_THRESHOLD). Keep this pull request focused on one logical topic and make the review plan explicit."
          else
            echo "✅ PR size is within the advisory threshold ($CHANGED <= $ADVISORY_THRESHOLD lines)"
          fi
