---
# SPDX-FileCopyrightText: 2025-2026 SecPal
# SPDX-License-Identifier: AGPL-3.0-or-later

# Note: This workflow uses inline jobs instead of calling reusable workflows
# to avoid a chicken-and-egg problem: the reusable workflows are not yet
# available on the main branch until this PR is merged.
# Other repositories should use the reusable workflows via reviewed immutable
# refs such as:
#   uses: SecPal/.github/.github/workflows/reusable-prettier.yml@<trusted-commit-sha>
#   uses: SecPal/.github/.github/workflows/reusable-markdown-lint.yml@<trusted-commit-sha>

name: Code Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-pins:
    name: Verify Workflow Pin Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"

      - name: Install Node dependencies
        run: npm ci

      - name: Verify external workflow references
        env:
          SECPAL_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.sha }}
          VERIFY_ACTION_PIN_PROVENANCE: "true"
        run: |
          bash tests/android-consumed-workflow-action-pins.sh
          bash tests/reusable-copilot-instructions-provenance.sh
          bash tests/dependabot-auto-merge.sh

  pr-review-workflow:
    name: Finite PR Review Workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run guarded-action unit tests
        run: python3 -m unittest tests/secpal-pr-review-actions-unit.py

      - name: Run simple resolver unit tests
        run: python3 -m unittest tests/secpal-resolve-fixed-threads-unit.py

      - name: Run finite lifecycle-orchestration unit tests
        run: python3 -m unittest tests/secpal-lifecycle-orchestration-unit.py
      - name: Run authenticated Ready/Draft lifecycle execution tests
        run: python3 -m unittest tests/secpal-lifecycle-execution-contract-unit.py

      - name: Run finite skill policy tests
        run: bash tests/secpal-pr-review-skill-policy.sh

      - name: Run fake-GitHub and temporary-HOME integration tests
        run: bash tests/secpal-pr-review-skill-integration.sh

  work-graph-resolver:
    name: Work-Graph Resolver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"

      # markdown-it provides the standards-compliant Markdown parsing the
      # structural acceptance-criteria check depends on.
      - name: Install Node dependencies
        run: npm ci

      - name: Run pure resolver and acceptance-criteria tests
        run: python3 -m unittest tests/secpal-work-graph-unit.py

      - name: Run fake-GitHub adapter and command tests
        run: python3 -m unittest tests/secpal-work-graph-adapter.py

      - name: Run advisory audit tests
        run: python3 -m unittest tests/secpal-work-graph-audit.py

      - name: Run Polyscope advisory contract tests
        run: python3 -m unittest tests/polyscope-work-graph-advisory.py

      - name: Run advisory PR gate behavior tests
        run: python3 -m unittest tests/secpal-pr-advisory-unit.py

      - name: Run graph-first replanning operation tests
        run: python3 -m unittest tests/secpal-work-graph-replan-unit.py

      - name: Run Polyscope replanning contract tests
        run: python3 -m unittest tests/polyscope-work-graph-replanning.py

      - name: Run evidence-architecture governance tests
        run: python3 tests/evidence-architecture-governance.py

      - name: Run PostgreSQL 18 baseline governance tests
        run: ./scripts/preflight.sh --postgresql-baseline-only

  vulnerability-policy:
    name: Vulnerability Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/vulnerability-policy.txt

      - name: Install vulnerability-policy dependencies
        run: python3 -m pip install --requirement requirements/vulnerability-policy.txt

      - name: Run vulnerability-policy contract tests
        run: python3 tests/secpal-vulnerability-policy-unit.py

      - name: Run released-artifact re-evaluation contract tests
        run: python3 tests/secpal-vulnerability-reevaluation-unit.py

      - name: Replay pinned scanners with frozen vulnerability data
        run: python3 tests/secpal-vulnerability-scanner-replay.py

  dependabot-manifest-guard:
    name: Dependabot Manifest Guard Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"

      - name: Install parser dependencies
        run: npm ci --ignore-scripts

      - name: Run manifest coverage contract tests
        run: node --test tests/dependabot-manifest-coverage.test.mjs

      - name: Verify reusable workflow trust boundary
        run: bash tests/dependabot-manifest-coverage-workflow.sh

  prettier:
    name: Check Code Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"

      - name: Install Node dependencies
        run: npm ci

      - name: Run Prettier Check
        run: npx prettier --check '**/*.{md,yml,yaml,json}'

  markdown-lint:
    name: Lint Markdown Files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"

      - name: Install Node dependencies
        run: npm ci

      - name: Run markdownlint
        run: >
          npx markdownlint --config .markdownlint.json --dot "**/*.md"
          --ignore node_modules --ignore vendor --ignore storage
          --ignore build --ignore .git
