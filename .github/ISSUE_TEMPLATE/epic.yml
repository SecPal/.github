name: 🗺️ Epic (Multiple Contracts)
description: Work holding more than one deliverable contract, tracked through native sub-issues
title: "[EPIC] "
labels: ["type/epic"]
body:
  - type: markdown
    attributes:
      value: |
        ## Epic Issue Template

        Use this template for work that holds more than one deliverable contract.

        **What is an Epic?**
        - Work holding several independently deliverable contracts
        - Multi-phase implementation whose phases merge separately
        - Work sequencing changes across repositories or areas (DB, API, auth, etc.)

        **Workflow:**
        1. Create this epic first
        2. Create one delivery issue per contract (use the "Delivery Issue" template)
        3. Attach them as native sub-issues; GitHub tracks their state and order
        4. Link PRs to related work; use closing keywords only when the PR completes it
        5. Close the epic once its intended outcome is verified

        📚 Full documentation: See [docs/EPIC_WORKFLOW.md](https://github.com/SecPal/.github/blob/main/docs/EPIC_WORKFLOW.md)

        📐 Native delivery guidance: See [docs/work-graph-contract.md](https://github.com/SecPal/.github/blob/main/docs/work-graph-contract.md)

  - type: textarea
    id: goal
    attributes:
      label: 🎯 Goal
      description: High-level description of what this epic aims to achieve
      placeholder: |
        Implement multi-tenant security with envelope encryption...
    validations:
      required: true

  - type: textarea
    id: sequencing
    attributes:
      label: 🧭 Sequencing Rationale
      description: |
        Create one delivery issue per contract with the "Delivery Issue (Part of
        Epic)" template and attach them as native sub-issues. Their state, order, and
        dependencies live in GitHub; do not repeat them here.
        Use this field only to explain sequencing that the graph cannot show,
        such as why a gate exists or which phase must land first.
      placeholder: |
        The schema change gates everything else, because both consumers read it.
        The Android work can run in parallel once the contract is published.
    validations:
      required: false

  - type: textarea
    id: technical_approach
    attributes:
      label: 🎨 Technical Approach
      description: High-level technical decisions, architecture, patterns to use
      placeholder: |
        - Use libsodium for encryption
        - PostgreSQL 18 for database
        - TDD approach with PEST
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: ✅ Acceptance Criteria
      description: |
        What must be observably true once this epic is done? Describe the
        outcome, not child status: native sub-issue state already shows what is
        closed, and generic testing or coverage items belong to no contract.
      placeholder: |
        - [ ] A guard can open a shift offline and it syncs without data loss
        - [ ] The published API contract covers every field the app consumes
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: 🚫 Non-Goals
      description: What is explicitly out of scope for this epic?
      placeholder: |
        - User interface implementation (separate epic)
        - External API integrations (future work)
    validations:
      required: false

  - type: textarea
    id: related_resources
    attributes:
      label: 🔗 Related Resources
      description: Links to design docs, RFCs, related epics, external resources
      placeholder: |
        - Design doc: https://...
        - Related epic: #123
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        ## 📝 Next Steps After Creating This Issue

        1. **Create Delivery Issues**: Use the "Delivery Issue (Part of Epic)" template, one per contract
        2. **Attach Them Natively**: Add each as a native sub-issue and order them there, not in this body
        3. **Start Work**: Select work using native issue state and actual technical dependencies
        4. **PR Linking**: Use ordinary references for related work; closing keywords mean completed work
        5. **Close Epic**: Verify the intended outcome across its repositories, then close the epic

        **Example:** See Issue #50 in the api repository for a real-world example.
