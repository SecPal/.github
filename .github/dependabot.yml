---
# Dependabot configuration for SecPal .github repository
# Tracks dependency updates, including major versions where allowed.
# Security updates are prioritized and checked daily in early morning hours
version: 2
updates:
  # GitHub Actions - Workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    # Let Dependabot update each SecPal component independently, including merge authority.
    groups:
      github-actions-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "SecPal/.github/*"
        update-types:
          - "patch"
      github-actions-minor:
        patterns:
          - "*"
        exclude-patterns:
          - "SecPal/.github/*"
        update-types:
          - "minor"
      github-actions-major:
        patterns:
          - "*"
        exclude-patterns:
          - "SecPal/.github/*"
        update-types:
          - "major"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    target-branch: "main"
    pull-request-branch-name:
      separator: "-"

  # GitHub Actions - Composite action dependencies
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/trivy-repository-scan"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    target-branch: "main"
    pull-request-branch-name:
      separator: "-"

  # npm - Governance tooling and lockfile
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
      - "dependabot"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    target-branch: "main"
    pull-request-branch-name:
      separator: "-"

  # pre-commit - Remote hook revisions
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "dependabot"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    target-branch: "main"
    pull-request-branch-name:
      separator: "-"

  # pip - Vulnerability policy tooling
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
      - "dependabot"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    target-branch: "main"
    pull-request-branch-name:
      separator: "-"
